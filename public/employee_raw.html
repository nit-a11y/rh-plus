<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raw Employee Manager | RH+</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/global.css">
    <style>
        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #888; border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #555; }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-900 min-h-screen flex flex-col">
    <header class="bg-gray-900 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold uppercase tracking-tight">Raw <span class="text-red-500">Employee</span> Manager</h1>
        <div class="flex gap-4">
            <button onclick="openModal()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded font-bold text-xs uppercase transition-all">Novo Colaborador</button>
            <a href="/" class="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded font-bold text-xs uppercase transition-all">Dashboard</a>
        </div>
    </header>

    <main class="flex-1 p-6 flex flex-col gap-6">
        <div class="bg-white p-4 rounded-lg shadow-sm flex gap-4 items-center">
            <input type="text" id="search" placeholder="Buscar por nome, matrícula ou CPF..." class="flex-1 p-2 border rounded outline-none focus:ring-2 focus:ring-red-500">
            <span id="counter" class="text-xs font-bold text-gray-500 uppercase">Carregando...</span>
        </div>

        <div class="flex-1 bg-white rounded-lg shadow-sm overflow-hidden flex flex-col">
            <div class="overflow-x-auto custom-scroll">
                <table class="w-full text-left border-collapse min-w-[3000px]">
                    <thead class="bg-gray-50 border-b sticky top-0 z-10">
                        <tr id="table-head">
                            <!-- Colunas via JS -->
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y text-xs">
                        <!-- Dados via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal de Inserção -->
    <div id="modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-6xl max-h-[95vh] flex flex-col overflow-hidden">
            <header class="p-4 border-b bg-gray-50 flex justify-between items-center">
                <h2 class="font-bold uppercase">Inserir Novo Colaborador</h2>
                <button onclick="closeModal()" class="text-gray-500 hover:text-black">✕</button>
            </header>
            
            <!-- SMART PASTE AREA -->
            <div class="p-4 bg-amber-50 border-b">
                <label class="text-[10px] font-black uppercase text-amber-700 block mb-1">Smart Paste (Cole a linha do colaborador aqui para preencher automaticamente)</label>
                <textarea id="smart-paste" placeholder="Cole aqui os dados separados por TAB..." class="w-full h-12 p-2 text-[10px] border border-amber-200 rounded outline-none focus:ring-1 focus:ring-amber-500 bg-white" oninput="processSmartPaste()"></textarea>
            </div>

            <form id="employee-form" class="p-6 overflow-y-auto custom-scroll grid grid-cols-1 md:grid-cols-4 gap-4">
                <!-- Inputs via JS -->
            </form>
            <footer class="p-4 border-t bg-gray-50 flex justify-end gap-3">
                <button type="button" onclick="closeModal()" class="px-6 py-2 border rounded font-bold text-xs uppercase">Cancelar</button>
                <button type="button" onclick="saveEmployee()" class="px-6 py-2 bg-red-600 text-white rounded font-bold text-xs uppercase shadow-lg">Salvar Registro</button>
            </footer>
        </div>
    </div>

    <script>
        const columns = [
            'id', 'name', 'registrationNumber', 'role', 'sector', 'type', 'hierarchy', 
            'admissionDate', 'birthDate', 'currentSalary', 'photoUrl', 'street', 'city', 
            'neighborhood', 'state_uf', 'cep', 'employer_id', 'workplace_id', 'fatherName', 
            'motherName', 'gender', 'maritalStatus', 'ethnicity', 'educationLevel', 
            'placeOfBirth', 'personalEmail', 'personalPhone', 'work_schedule', 'work_scale', 
            'cbo', 'criado_em', 'lat', 'lng', 'initialRole', 'initialSalary', 'metadata', 
            'terminationReason', 'terminationDate', 'observation', 'cpf', 'updated_at'
        ];

        let allEmployees = [];

        async function loadEmployees() {
            try {
                const res = await fetch('/api/raw-employees');
                allEmployees = await res.json();
                renderTable();
            } catch (err) {
                console.error(err);
                alert('Erro ao carregar colaboradores');
            }
        }

        function renderTable() {
            const head = document.getElementById('table-head');
            const body = document.getElementById('table-body');
            const searchVal = document.getElementById('search').value.toLowerCase();
            
            // Header
            head.innerHTML = '<th class="p-3 uppercase font-black text-gray-400 text-[10px] w-20">Ações</th>' + 
                columns.map(c => `<th class="p-3 uppercase font-black text-gray-400 text-[10px] whitespace-nowrap">${c}</th>`).join('');

            // Body
            const filtered = allEmployees.filter(e => 
                (e.name?.toLowerCase().includes(searchVal)) || 
                (e.registrationNumber?.toString().includes(searchVal)) ||
                (e.cpf?.toString().includes(searchVal))
            );

            body.innerHTML = filtered.map(e => `
                <tr class="hover:bg-gray-50 transition-colors">
                    <td class="p-2 flex gap-1">
                        <button onclick="deleteEmployee('${e.id}')" class="bg-red-100 text-red-600 p-1 rounded hover:bg-red-600 hover:text-white transition-all" title="Excluir">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                        </button>
                    </td>
                    ${columns.map(c => {
                        let val = e[c];
                        const isDate = c.toLowerCase().includes('date');
                        const isProtected = ['id', 'criado_em', 'updated_at'].includes(c);
                        
                        let displayVal = val;
                        if (isDate && val) displayVal = new Date(val).toLocaleDateString('pt-BR');
                        if (val === null || val === undefined) displayVal = '';

                        return `
                            <td class="p-2 border-l max-w-[200px] truncate ${isProtected ? 'bg-gray-50 text-gray-400' : 'cursor-text focus:bg-white focus:ring-1 focus:ring-red-500'}" 
                                ${isProtected ? '' : `contenteditable="true" onblur="updateField('${e.id}', '${c}', this)"`}
                                title="${isProtected ? 'Protegido' : 'Clique para editar'}">
                                ${displayVal}
                            </td>
                        `;
                    }).join('')}
                </tr>
            `).join('');

            document.getElementById('counter').innerText = `${filtered.length} Colaboradores Encontrados`;
        }

        async function updateField(id, field, el) {
            let newValue = el.innerText.trim();
            
            // Tratamento especial para datas
            if (field.toLowerCase().includes('date') && newValue.includes('/')) {
                const [d, m, y] = newValue.split('/');
                if (d && m && y) newValue = `${y}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`;
            }

            try {
                const res = await fetch(`/api/raw-employees/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ field, value: newValue })
                });
                const result = await res.json();
                if (result.success) {
                    el.classList.add('bg-green-50');
                    setTimeout(() => el.classList.remove('bg-green-50'), 1000);
                } else {
                    alert('Erro ao atualizar: ' + result.error);
                }
            } catch (err) {
                console.error(err);
                alert('Erro na conexão ao atualizar');
            }
        }

        function openModal() {
            const form = document.getElementById('employee-form');
            document.getElementById('smart-paste').value = '';
            
            form.innerHTML = columns.map(c => {
                let type = 'text';
                if (c.toLowerCase().includes('date')) type = 'date';
                if (c.toLowerCase().includes('salary')) type = 'number';
                
                return `
                    <div class="flex flex-col gap-1">
                        <label class="text-[9px] font-black uppercase text-gray-400">${c}</label>
                        <input name="${c}" id="inp-${c}" type="${type}" step="any" class="p-1.5 border rounded text-[10px] outline-none focus:ring-1 focus:ring-red-500">
                    </div>
                `;
            }).join('');
            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        function processSmartPaste() {
            const rawText = document.getElementById('smart-paste').value;
            if (!rawText) return;

            // Separar por TAB
            const parts = rawText.split('\t');
            
            console.log('Smart Paste detectado:', parts.length, 'campos');

            columns.forEach((col, index) => {
                const input = document.getElementById(`inp-${col}`);
                if (!input) return;

                let val = parts[index] ? parts[index].trim() : '';
                
                // Tratar datas (DD/MM/YYYY -> YYYY-MM-DD)
                if (col.toLowerCase().includes('date') && val.includes('/')) {
                    const [d, m, y] = val.split('/');
                    if (d && m && y) val = `${y}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`;
                }

                input.value = val;
            });
        }

        async function saveEmployee() {
            const form = document.getElementById('employee-form');
            const data = {};
            
            columns.forEach(col => {
                const input = document.getElementById(`inp-${col}`);
                if (input && input.value !== '') {
                    data[col] = input.value;
                }
            });

            if (!data.name) return alert('Nome é obrigatório');

            try {
                const res = await fetch('/api/raw-employees', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                if (result.success) {
                    alert('Colaborador salvo com sucesso!');
                    closeModal();
                    loadEmployees();
                } else {
                    alert('Erro ao salvar: ' + result.error);
                }
            } catch (err) {
                console.error(err);
                alert('Erro crítico ao salvar');
            }
        }

        async function deleteEmployee(id) {
            if (!confirm('ATENÇÃO: Deseja excluir este registro PERMANENTEMENTE da tabela employees?')) return;
            
            try {
                const res = await fetch(`/api/raw-employees/${id}`, { method: 'DELETE' });
                const result = await res.json();
                if (result.success) {
                    loadEmployees();
                } else {
                    alert('Erro ao excluir: ' + result.error);
                }
            } catch (err) {
                console.error(err);
                alert('Erro crítico ao excluir');
            }
        }

        document.getElementById('search').oninput = renderTable;

        // Inicialização
        loadEmployees();
    </script>
</body>
</html>
